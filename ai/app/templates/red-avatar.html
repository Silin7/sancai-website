<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滨江区审计局 | 用户中心</title>
    <!-- 引入通用样式 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/red-common.css') }}">
    <!-- 引入头像页面专属样式 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/red-avatar.css') }}">
</head>

<body>
    <!-- 侧边导航栏 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <img src="{{ url_for('static', filename='red-img/logo.png') }}" alt="滨江区审计局" class="sidebar-logo">
        </div>

        <nav class="nav-menu">
            <ul>
                <li>
                    <a href="/dashboard">
                        <div class="menu-icon"><img src="{{ url_for('static', filename='red-img/icon/home.png') }}">
                        </div>
                        <span>仪表板</span>
                    </a>
                </li>
                <li>
                    <a href="/upload">
                        <div class="menu-icon"><img src="{{ url_for('static', filename='red-img/icon/ai.png') }}"></div>
                        <span>智能校核</span>
                    </a>
                </li>
                <li>
                    <a href="/avatar" class="active">
                        <div class="menu-icon"><img src="{{ url_for('static', filename='red-img/icon/user.png') }}">
                        </div>
                        <span>用户中心</span>
                    </a>
                </li>
                <li>
                    <a href="/setting">
                        <div class="menu-icon"><img src="{{ url_for('static', filename='red-img/icon/setting.png') }}">
                        </div>
                        <span>系统设置</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>

    <!-- 主内容区域 -->
    <div class="main-content">
        <!-- 固定顶部栏 -->
        <div class="fixed-top-bar">
            <div class="page-title">
                <h2>滨江区审计局 | AI工程合同智能校核系统</h2>
            </div>

            <!-- 用户信息区域 -->
            <div class="user-info" id="userInfo">
                <div class="user-avatar" id="headerAvatar">⏳</div>
                <div class="user-name" id="userName">加载中...</div>
                <div class="user-dropdown">▼</div>

                <div class="user-dropdown-menu" id="userDropdownMenu">
                    <a href="/avatar" class="dropdown-item">用户资料</a>
                    <a href="#" class="dropdown-item">修改密码</a>
                    <!-- 登出功能已移除，系统自动管理用户session -->
                </div>
            </div>
        </div>

        <!-- 实际内容区域 -->
        <div class="content-wrapper">
            <div class="avatar-container">
                <!-- 页面标题 -->
                <div class="avatar-page-header">
                    <span class="header-icon">👤</span>
                    <h1 class="avatar-page-title">选择您的头像</h1>
                </div>
                <p class="avatar-subtitle">点击喜欢的头像来个性化您的账户</p>

                <!-- 头像显示区域 -->
                <div class="avatar-display-row">
                    <!-- 当前头像 -->
                    <div class="avatar-display-card">
                        <div class="display-card-header">
                            <span class="card-icon">👤</span>
                            <span class="card-label">当前头像</span>
                        </div>
                        <div class="avatar-circle" id="current-avatar">
                            <span class="loading-spinner">⏳</span>
                        </div>
                        <p class="card-hint">您当前使用的头像</p>
                    </div>

                    <!-- 选中的头像 -->
                    <div class="avatar-display-card selected-card">
                        <div class="display-card-header">
                            <span class="card-icon">👁️</span>
                            <span class="card-label">当前选择</span>
                        </div>
                        <div class="avatar-circle avatar-placeholder" id="selected-avatar">
                            <span class="placeholder-icon">📷</span>
                        </div>
                        <p class="card-hint" id="selected-avatar-text">请选择一个头像</p>
                    </div>
                </div>

                <!-- 表情符号头像 -->
                <div class="avatar-section">
                    <div class="section-header">
                        <span class="section-icon">😊</span>
                        <h2 class="section-title">表情符号头像</h2>
                    </div>
                    <div class="avatar-grid" id="emoji-avatars"></div>
                </div>

                <!-- 图标头像 -->
                <div class="avatar-section">
                    <div class="section-header">
                        <span class="section-icon">🎨</span>
                        <h2 class="section-title">图标头像</h2>
                    </div>
                    <div class="avatar-grid" id="svg-avatars"></div>
                </div>

                <!-- 操作按钮 -->
                <div class="avatar-actions">
                    <button class="btn btn-outline" onclick="goBack()">
                        ← 返回
                    </button>
                    <button class="btn" onclick="saveAvatar()">
                        💾 保存头像
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量存储头像数据
        let allAvatars = {};
        let selectedAvatar = null;

        // 加载头像列表
        async function loadAvatars() {
            try {
                const response = await fetch('/api/user/avatars');
                const result = await response.json();

                if (result.success) {
                    allAvatars = result.avatars;
                    renderAvatarGrid();
                    loadCurrentUser();
                } else {
                    console.error('加载头像列表失败:', result.error);
                }
            } catch (error) {
                console.error('加载头像列表异常:', error);
            }
        }

        // 渲染头像网格
        function renderAvatarGrid() {
            // 渲染表情符号头像
            const emojiContainer = document.getElementById('emoji-avatars');
            emojiContainer.innerHTML = '';
            allAvatars.emoji.forEach(avatar => {
                const div = document.createElement('div');
                div.className = 'avatar-option';
                div.innerHTML = avatar;
                div.onclick = () => selectAvatar(avatar, 'emoji', div);
                emojiContainer.appendChild(div);
            });

            // 渲染SVG头像
            const svgContainer = document.getElementById('svg-avatars');
            svgContainer.innerHTML = '';
            allAvatars.svg.forEach(avatar => {
                const div = document.createElement('div');
                div.className = 'avatar-option';
                div.innerHTML = avatar;
                div.onclick = () => selectAvatar(avatar, 'svg', div);
                svgContainer.appendChild(div);
            });
        }

        // 选择头像
        function selectAvatar(avatar, type, element) {
            // 清除之前的选择
            document.querySelectorAll('.avatar-option').forEach(option => {
                option.classList.remove('selected');
            });

            // 标记新选择的头像
            element.classList.add('selected');
            selectedAvatar = { avatar, type };

            // 更新当前选择显示
            updateSelectedAvatarDisplay(avatar);
        }

        // 更新当前选择头像显示
        function updateSelectedAvatarDisplay(avatar) {
            const selectedAvatarElement = document.getElementById('selected-avatar');
            const selectedAvatarText = document.getElementById('selected-avatar-text');

            selectedAvatarElement.innerHTML = avatar;
            selectedAvatarElement.classList.remove('avatar-placeholder');
            selectedAvatarElement.classList.add('avatar-selected');
            selectedAvatarText.textContent = '已选择头像';
            selectedAvatarText.classList.add('text-primary');
        }

        // 加载当前用户信息
        async function loadCurrentUser() {
            try {
                const response = await fetch('/api/user/info');
                const result = await response.json();

                if (result.success) {
                    const currentAvatarElement = document.getElementById('current-avatar');
                    currentAvatarElement.innerHTML = result.avatar;

                    const headerAvatarElement = document.getElementById('headerAvatar');
                    headerAvatarElement.innerHTML = result.avatar;

                    // 更新用户名
                    const userNameElement = document.getElementById('userName');
                    if (userNameElement) {
                        userNameElement.textContent = result.username;
                    }

                    // 如果用户已有选择的头像，标记它
                    if (result.avatar) {
                        document.querySelectorAll('.avatar-option').forEach(option => {
                            if (option.innerHTML.trim() === result.avatar.trim()) {
                                option.classList.add('selected');
                                updateSelectedAvatarDisplay(result.avatar);
                                selectedAvatar = { avatar: result.avatar, type: 'current' };
                            }
                        });
                    }
                }
            } catch (error) {
                console.error('加载用户信息异常:', error);
            }
        }

        // 保存头像
        async function saveAvatar() {
            if (!selectedAvatar) {
                alert('请选择一个头像');
                return;
            }

            try {
                const response = await fetch('/api/user/avatar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        avatar: selectedAvatar.avatar,
                        type: selectedAvatar.type
                    })
                });

                const result = await response.json();

                if (result.success) {
                    alert('头像保存成功！');
                    goBack();
                } else {
                    alert('保存失败: ' + result.error);
                }
            } catch (error) {
                console.error('保存头像异常:', error);
                alert('保存失败，请稍后重试');
            }
        }

        // 返回上一页
        function goBack() {
            window.history.back();
        }

        // 用户下拉菜单功能
        const userInfo = document.getElementById('userInfo');
        const userDropdownMenu = document.getElementById('userDropdownMenu');
        const userDropdownIcon = document.querySelector('.user-dropdown');
        // const logoutBtn = document.getElementById('logoutBtn'); // 已移除

        userInfo.addEventListener('click', function (e) {
            e.stopPropagation();
            userDropdownMenu.classList.toggle('show');
            if (userDropdownMenu.classList.contains('show')) {
                userDropdownIcon.style.transform = 'rotate(180deg)';
            } else {
                userDropdownIcon.style.transform = 'rotate(0)';
            }
        });

        document.addEventListener('click', function () {
            userDropdownMenu.classList.remove('show');
            userDropdownIcon.style.transform = 'rotate(0)';
        });

        userDropdownMenu.addEventListener('click', function (e) {
            e.stopPropagation();
        });

        // Note: 登出功能已移除

        // 页面加载时执行
        document.addEventListener('DOMContentLoaded', loadAvatars);
    </script>
</body>

</html>
