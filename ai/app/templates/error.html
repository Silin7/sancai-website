<!DOCTYPE html>
<html lang="zh-CN" data-theme="red">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error_title or '出错了' }} - 造价AI助手</title>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f5f5 0%, #e5e5e5 100%);
        }

        .error-container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            max-width: 400px;
        }

        .error-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #a6171c 0%, #8a1217 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .error-icon i {
            font-size: 36px;
            color: white;
        }

        .error-title {
            font-size: 24px;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 10px;
        }

        .error-message {
            color: #6b7280;
            margin-bottom: 24px;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 24px;
            background: #a6171c;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: #8a1217;
        }
    </style>
</head>

<body>
    <div class="error-container">
        <div class="error-icon">
            <i class="fa fa-exclamation-triangle"></i>
        </div>
        <div class="error-title">{{ error_title or '出错了' }}</div>
        <div class="error-message">{{ error_message or '页面加载失败，请稍后重试' }}</div>
        <a href="/" class="back-btn">返回首页</a>
    </div>
</body>

</html>
