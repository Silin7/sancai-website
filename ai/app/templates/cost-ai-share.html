<!DOCTYPE html>
<html lang="zh-CN" data-theme="red">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ share_data.title }} - 造价AI助手分享</title>

    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">

    <!-- 本地TailwindCSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">

    <!-- 页面专属样式 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cost-ai.css') }}">

    <style>
        /* 分享页面特殊样式 */
        .share-badge {
            background: linear-gradient(135deg, #a6171c 0%, #8a1217 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .share-info-bar {
            background: rgba(166, 23, 28, 0.05);
            border-bottom: 1px solid rgba(166, 23, 28, 0.1);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .conversation-item-readonly {
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .conversation-item-readonly i {
            opacity: 0.7;
        }
    </style>
</head>

<body class="font-sans bg-gray-50 text-gray-900 h-screen flex overflow-hidden">
    <!-- 左侧导航栏 -->
    <aside class="w-64 flex flex-col h-full shadow-sm z-10">
        <!-- Logo区域 -->
        <div class="sidebar-header flex items-center space-x-3">
            <div class="w-10 h-10 rounded-lg logo-container flex items-center justify-center">
                <i class="fa fa-calculator text-xl"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold">造价AI助手</h1>
                <p class="text-xs text-gray-500">智能工程造价解决方案</p>
            </div>
        </div>

        <!-- 功能导航 -->
        <nav class="p-3 space-y-1 flex-1 overflow-y-auto scrollbar-hide">
            <p class="text-sm font-medium text-gray-500 uppercase tracking-wider px-3 py-2">分享的对话</p>

            <!-- 当前分享的对话（只读） -->
            <div class="conversation-item-readonly">
                <i class="fa fa-comments"></i>
                <span class="truncate flex-1">{{ share_data.title }}</span>
            </div>

            <!-- 提示信息 -->
            <div class="mt-6 px-3">
                <div class="text-xs text-white/50 space-y-2">
                    <p><i class="fa fa-info-circle mr-1"></i> 这是一个分享的对话</p>
                    <p><i class="fa fa-clock-o mr-1"></i> 分享于 {{ share_data.created_at[:10] }}</p>
                </div>
            </div>

            <!-- 访问完整版 -->
            <div class="mt-6">
                <a href="/cost-ai"
                    class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg bg-white/10 font-medium hover:bg-white/20 transition-colors duration-200 text-white">
                    <i class="fa fa-external-link w-5 text-center"></i>
                    <span>访问完整版</span>
                </a>
            </div>
        </nav>
    </aside>

    <!-- 主内容区域 -->
    <div class="main-content">
        <!-- 固定顶部栏 -->
        <div class="fixed-top-bar">
            <div class="page-title">
                <h2>滨江区审计局 | 工程造价AI助手</h2>
            </div>

            <!-- 聊天标题 (居中) -->
            <div class="chat-title-container" style="display: flex;">
                <span class="chat-title-text">{{ share_data.title }}</span>
                <span class="share-badge ml-3">
                    <i class="fa fa-share-alt"></i> 分享
                </span>
            </div>

            <!-- 空白区域占位 -->
            <div style="width: 200px;"></div>
        </div>

        <!-- 分享提示条 -->
        <div class="share-info-bar">
            <i class="fa fa-share-alt text-primary"></i>
            <span class="text-sm text-gray-600">您正在查看一个分享的对话</span>
        </div>

        <!-- 实际内容区域 -->
        <div class="content-wrapper bg-[#f9fafb] relative" style="height: calc(100% - 100px);">
            <!-- 对话内容区域 -->
            <div class="flex-1 overflow-y-auto px-4 py-3 scrollbar-hide relative z-10" id="chat-container"
                style="background-color: #f5f5f5; height: 100%;">
                <!-- 消息将在这里渲染 -->
            </div>
        </div>

        <!-- 底部提示（无输入框） -->
        <div class="input-area-wrapper p-4 md:p-6" style="background: #f5f5f5;">
            <div class="footer-notice text-center">
                <p class="text-xs text-gray-400">AI生成内容仅供参考，请以实际国家标准、规范为准</p>
                <p class="text-xs text-gray-400 mt-1">
                    <a href="/cost-ai" class="text-primary hover:underline">登录后</a> 可以开始自己的对话
                </p>
            </div>
        </div>
    </div>

    <!-- 分享页面专用脚本 -->
    <script>
        // 分享数据
        const shareData = {{ share_data | tojson | safe }};

        // AI头像SVG
        const aiAvatarSvg = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
      <defs>
        <linearGradient id="grad_ai" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#a6171c;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#8a1217;stop-opacity:1" />
        </linearGradient>
      </defs>
      <circle cx="50" cy="50" r="50" fill="url(#grad_ai)"/>
      <circle cx="50" cy="38" r="15" fill="#ffffff" opacity="0.9"/>
      <rect x="30" y="58" width="40" height="38" rx="10" fill="#ffffff" opacity="0.9"/>  
    </svg>`;

        // 用户头像
        const userAvatarSvg = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
      <circle cx="50" cy="50" r="50" fill="#e5e7eb"/>
      <circle cx="50" cy="38" r="15" fill="#9ca3af"/>
      <rect x="30" y="58" width="40" height="38" rx="10" fill="#9ca3af"/>  
    </svg>`;

        // 转义HTML
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 渲染用户消息
        function renderUserMessage(container, content, time) {
            const userHtml = `
        <div class="chat-message-wrapper justify-end user-message-wrapper">
          <div class="flex flex-col items-end" style="max-width: 60%;">
            <div class="chat-bubble-user">
              ${escapeHtml(content).replace(/\n/g, '<br>')}
            </div>
            <div class="chat-time">${time}</div>
          </div>
          <div class="chat-avatar ml-2">
            <div class="w-full h-full bg-gray-100 flex items-center justify-center text-lg select-none" style="border-radius: 4px;">
              ${userAvatarSvg}
            </div>
          </div>
        </div>`;
            container.insertAdjacentHTML('beforeend', userHtml);
        }

        // 渲染AI消息
        function renderAiMessage(container, content, time) {
            const aiHtml = `
        <div class="chat-message-wrapper justify-start assistant-message">
          <div class="chat-avatar mr-2">
            <div class="w-full h-full overflow-hidden" style="border-radius: 4px;">
              ${aiAvatarSvg}
            </div>
          </div>
          <div class="flex flex-col items-start" style="max-width: 60%;">
            <div class="chat-bubble-ai">
              ${escapeHtml(content).replace(/\n/g, '<br>')}
            </div>
            <div class="flex items-center space-x-3 chat-time">
              <span>${time}</span>
            </div>
          </div>
        </div>`;
            container.insertAdjacentHTML('beforeend', aiHtml);
        }

        // 页面加载时渲染消息
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('chat-container');
            const messages = shareData.messages || [];

            messages.forEach(msg => {
                if (msg.role === 'user') {
                    renderUserMessage(container, msg.content, msg.time);
                } else if (msg.role === 'assistant') {
                    renderAiMessage(container, msg.content, msg.time);
                }
            });

            // 滚动到顶部（分享页面默认从头开始看）
            container.scrollTop = 0;
        });
    </script>
</body>

</html>
